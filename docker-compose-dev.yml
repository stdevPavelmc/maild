# Local Development Docker Compose Configuration
# Usage: docker compose --env-file env.dev -f docker-compose-dev.yml up
#
# Key differences from production:
# - env.dev (fake, committed dev secrets) is both the compose interpolation file
#   AND the containers' env_file, instead of the production .env
# - Fixed image names (pavelmc/maild-*:develop)
# - Local bind mount volumes (./ldata/*)
# - JSON logging instead of syslog
# - More ports exposed for debugging
# - No Traefik labels
# - Local network (not external)
#
# Env schema: every tunable defaults INSIDE each service image (ENV in the
# Dockerfiles, per service — only the vars that service consumes). env.dev carries
# just the deployment values (domain, admin user, fake secrets) and any deviation
# from an image default: a same-named var in the env file always wins over the
# image default (never leave one empty — comment it out instead).
# The env file is injected ONLY into the 7 DB-consumer services; clamav needs no
# catalogue access (its two knobs are explicit environment entries below).

networks:
  maild-dev:
    driver: bridge

services:
  db:
    image: pavelmc/maild-db:develop
    build: ./db/
    container_name: maild-dev-db
    hostname: db
    restart: unless-stopped
    environment:
      # explicit on every DB consumer: compose interpolation does not read env_file
      # contents, and the guard makes a missing password fail at `compose config`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
    # operator env file (fake dev secrets); overrides any same-named image ENV default
    env_file:
      - env.dev
    volumes:
      - ./ldata/db:/var/lib/postgresql/data
    networks:
      - maild-dev
    ports:
      - "5432:5432"  # Exposed for local debugging

  api:
    image: pavelmc/maild-api:develop
    build: ./adminng/api/
    container_name: maild-dev-api
    hostname: api
    restart: unless-stopped
    environment:
      # explicit on every DB consumer (see the note on the db service): the guard
      # makes a missing password fail at `compose config`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
      ADMINNG_SECRET_KEY: ${ADMINNG_SECRET_KEY:?set ADMINNG_SECRET_KEY in env.dev}
      # The api is the first-boot provisioning leader now (admin is retired): it seeds
      # DEFAULT_DOMAIN, the superadmin and the default aliases before uvicorn starts.
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in env.dev}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
      # Interpolated so bootstrap-dev.sh --skip-default-domain can disable the boot-time
      # seeder for that run (env.dev does not set it; the image default is yes).
      AUTO_PROVISION: ${AUTO_PROVISION:-yes}
    # operator env file (fake dev secrets); overrides any same-named image ENV default
    env_file:
      - env.dev
    volumes:
      # quota usage = Maildir++ .maildirsize; the API never writes mail storage
      - ./ldata/vmail:/home/vmail:ro
    depends_on:
      - db
    networks:
      - maild-dev

  adminng:
    image: pavelmc/maild-adminng:develop
    build: ./adminng/pwa/
    container_name: maild-dev-adminng
    hostname: adminng
    restart: unless-stopped
    # no env_file on purpose: static bundle + same-origin proxy to `api`.
    ports:
      - "8083:80"   # PWA + /api/v1 proxy - plain HTTP (harness, desktop LAN, CA download)
      - "8084:443"  # HTTPS (dev only) - phone/PWA secure origin, local CA
    volumes:
      # The optional TLS vhost (inactive in the image) + the shared certs volume
      # with adminng.crt/adminng.key issued by adminng/pwa/tls-cert-generate.sh.
      - ./ldata/certs:/certs:ro
      - ./adminng/pwa/nginx/tls.conf:/etc/nginx/conf.d/10-tls.conf:ro
    depends_on:
      - api
    networks:
      - maild-dev

  # Browser test harness (DEV ONLY): Playwright flows + Lighthouse budget.
  # One-shot, never started by `up` (profile `test`); use
  #   ./adminng/pwa-test/run.sh [verify|flows|installable|superadmin|a11y|visual|lighthouse|shell]
  # It is deliberately absent from the production compose files.
  pwa-test:
    image: pavelmc/maild-pwa-test:develop
    build: ./adminng/pwa-test/
    container_name: maild-dev-pwa-test
    hostname: pwa-test
    profiles: ["test"]
    restart: "no"
    init: true
    # The harness runs as root (Chromium sandbox off, docker socket readable) and
    # hands the artifacts back to the invoking user on exit: run.sh passes the
    # uid/gid, so ldata/e2e never ends up root-owned.
    environment:
      E2E_CHOWN_UID: "${PWA_TEST_UID:-0}"
      E2E_CHOWN_GID: "${PWA_TEST_GID:-0}"
      # The entrypoint tunnels this origin to http://adminng:80: `localhost` is a
      # secure context, so the service worker / installability / offline checks
      # run exactly as they do against a real deployment.
      ADMINNG_URL: http://localhost:8083
      E2E_UPSTREAM_HOST: adminng
      E2E_UPSTREAM_PORT: "80"
      E2E_PROXY_PORT: "8083"
      E2E_ARTIFACTS: /artifacts
      MAILD_ROOT: /repo
      # Approval is out of band by design: the suite drives the documented
      # `adminng.py --approve-device` CLI inside the api container.
      ADMINNG_API_CONTAINER: maild-dev-api
    volumes:
      - ./test.creds:/repo/test.creds:ro
      - ./ldata/e2e:/artifacts
      # dev-only trust: the harness needs `docker exec` for the device CLI.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
      adminng:
        condition: service_healthy
    networks:
      - maild-dev

  mua:
    image: pavelmc/maild-mua:develop
    build: ./mua/
    container_name: maild-dev-mua
    hostname: mua
    restart: unless-stopped
    environment:
      # SnappyMail's entrypoint writes the contacts DSN with this password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
    ports:
      - "8081:80"  # Exposed for local access
    # operator env file (fake dev secrets); overrides any same-named image ENV default
    env_file:
      - env.dev
    volumes:
      # NOTE: SnappyMail is baked into the image at /var/www/html; mounting a host directory
      # OVER that path hides the application on a fresh volume (Apache answers 403 and the
      # entrypoint waits forever for admin_password.txt) and would also pin the app to whatever
      # version the volume was first seeded with. Only the writable `data/` directory is
      # persisted, and bootstrap-dev.sh hands it to www-data so SnappyMail can initialise.
      - ./ldata/mua_web:/var/www/html/data
    depends_on:
      - mda
    networks:
      - maild-dev

  mda:
    image: pavelmc/maild-mda:develop
    build: ./mda/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-dev-mda
    hostname: mda
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in env.dev}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
    # DEFAULT_MAILBOX_SIZE (200M), the quota-report schedule and the self-signed
    # cert subject now default in the image; override them from env.dev when needed.
    # Operator env file; overrides any same-named image ENV default.
    env_file:
      - env.dev
    ports:
      - "110:110"    # POP3 - exposed for debugging
      - "143:143"    # IMAP - exposed for debugging
      - "993:993"    # IMAPS
      - "995:995"    # POP3S
      - "4190:4190"  # ManageSieve - exposed for debugging
      - "12345:12345" # SASL - exposed for debugging
    depends_on:
      - db
    volumes:
      - ./ldata/vmail:/home/vmail
      - ./ldata/certs:/certs
      - ./ldata/spool:/var/spool/
    networks:
      - maild-dev

  mta:
    image: pavelmc/maild-mta:develop
    build: ./mta/
    container_name: maild-dev-mta
    domainname: ${DEFAULT_DOMAIN}
    hostname: mta
    restart: unless-stopped
    environment:
      MAILADMIN: ${MAIL_ADMIN_USER:-sysadmin}@${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in env.dev}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in env.dev}
      DEBUG: 'true'
      # explicit on every DB consumer (see the note on the db service)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
    # MAX_MESSAGESIZE / SPF / DNSBL / peer timeouts now default in the image;
    # override them (or RELAY / ALWAYS_BCC / POSTMASTER_ABUSE_SETUP) from env.dev.
    # Operator env file; overrides any same-named image ENV default.
    env_file:
      - env.dev
    ports:
      - "25:25"      # SMTP
      - "465:465"    # SMTPS
      - "587:587"    # Submission
    volumes:
      - ./ldata/vmail:/home/vmail
      - ./ldata/certs:/certs
      - ./ldata/spool:/var/spool/
    depends_on:
      - db
      - mda
      - amavis
      - clamav
    networks:
      - maild-dev

  clamav:
    image: pavelmc/maild-clamav:develop
    build: ./clamav/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-dev-clamav
    hostname: clamav
    restart: unless-stopped
    # no env_file on purpose: clamav needs no catalogue access (variable separation).
    # Its only knobs default unset in the image and are passed as explicit entries:
    # an empty value behaves exactly like unset for both (the entrypoint tests
    # them with `if [ "$VAR" ]`), so `${VAR:-}` is safe here.
    environment:
      ALTERNATE_MIRROR: ${ALTERNATE_MIRROR:-}
      CLAMAV_DEBUG: ${CLAMAV_DEBUG:-}
    ports:
      - "3310:3310"  # ClamAV - exposed for debugging
    volumes:
      - ./ldata/clamav:/var/lib/clamav
      - ./ldata/amavis:/var/lib/amavis
    networks:
      - maild-dev

  amavis:
    image: pavelmc/maild-amavis:develop
    build: ./amavis/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-dev-amavis
    hostname: amavis
    restart: unless-stopped
    environment:
      # explicit on every DB consumer (see the note on the db service): the entrypoint
      # queries the catalogue for the domain list
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
      # dev only: ClamAV needs a first virus-DB download that can take many minutes on a fresh
      # volume, and amavis would then defer mail. Set AV_ENABLED=yes in env.dev (or the shell)
      # to exercise the AV path locally; the delivery path under test is Postfix -> amavis -> LMTP.
      AV_ENABLED: ${AV_ENABLED:-no}
      SPAM_FILTER_ENABLED: ${SPAM_FILTER_ENABLED:-no}
    # AV/SPAM/DKIM and the SpamAssassin tuning now default in the image; override
    # them from env.dev. Operator env file; overrides any same-named image ENV default.
    env_file:
      - env.dev
    ports:
      - "10024:10024"  # Amavis content filter - exposed for debugging
    volumes:
      - ./ldata/amavis:/var/lib/amavis
      - ./ldata/spamassassin:/var/lib/spamassassin
      - ./ldata/spool:/var/spool/
    depends_on:
      - db
    networks:
      - maild-dev

  cron:
    image: pavelmc/maild-cron:develop
    build: ./cron/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-dev-cron
    hostname: cron
    restart: unless-stopped
    environment:
      # explicit on every DB consumer (see the note on the db service): the cron
      # scripts talk to the catalogue with psql; the resume/report jobs also need
      # the deployment coordinates (the entrypoint dumps the environment into
      # /etc/environment, from where every cron job sources it).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.dev}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in env.dev}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
    # operator env file (fake dev secrets); overrides any same-named image ENV default
    env_file:
      - env.dev
    volumes:
      - ./ldata/logs:/var/log
      - ./ldata/vmail:/home/vmail
      # parity with production (`/var/backups/maild:/backups`): without it /scripts/backup_db.sh
      # writes into the container's writable layer and the daily dump vanishes on every recreate.
      - ./ldata/backups:/backups
    depends_on:
      - db
    networks:
      - maild-dev

  dozzle:
    image: amir20/dozzle:latest
    container_name: maild-dev-dozzle
    hostname: dozzle
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - maild-dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ldata/dozzle:/data
