# Production Docker Compose Configuration — Docker Hub images (preferred / general use).
#
# This is the PRODUCTION source of truth, derived from docker-compose-dev.yml.
#   - Any perdurable change on docker-compose-dev.yml must be mirrored here.
#   - compose-github.yml and compose-gitlab.yml are STRICT copies of this file and must be
#     chain-updated whenever it changes (only the image: lines differ).
#   - compose-dockerhub.yml no longer exists: this file *is* the Docker Hub one.
#
# Differences from docker-compose-dev.yml:
#   - Real .env (secrets, git-ignored) instead of env.dev, for BOTH the compose
#     interpolation and the containers' env_file
#   - Published images pavelmc/maild-<svc>:latest instead of local :develop builds
#   - Named docker volumes instead of ./ldata/* bind mounts
#   - syslog logging instead of JSON; no dozzle (dev-only log viewer)
#   - External `maild` network, shared with the ingress reverse proxy
#   - Traefik labels expose the webmail/admin HTTP UIs (TLS is terminated by YOUR proxy)
#
# Env schema: every tunable defaults INSIDE each service image (ENV in the
# Dockerfiles, per service — only the vars that service consumes). Your .env
# carries just the deployment values (domain, admin user, secrets) and any
# deviation from an image default: a same-named var in .env always wins over the
# image default (never leave one empty — comment it out instead).
# .env is injected ONLY into the 7 DB-consumer services; clamav needs no
# catalogue access (its two knobs are explicit environment entries below).
#
# NOTE: the `maild` network is external, create it once on the host:
#   docker network create maild
# Your ingress controller (Traefik, Nginx, ...) must join that network to reach the UIs.

networks:
  maild:
    external: true

volumes:
  vmail:        # mail storage
  spool:        # temp mail storage
  clamav:       # AV storage
  amavis:       # filtering storage
  spamassassin: # spam data
  db:           # database storage
  mua_web:      # mua web data
  db_backups:   # database backups

services:
  db:
    image: pavelmc/maild-db:latest
    build: ./db/
    container_name: maild-db
    hostname: db
    restart: always
    environment:
      # explicit on every DB consumer: compose interpolation does not read env_file
      # contents, and the guard makes a missing password fail at `compose config`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - maild

  api:
    image: pavelmc/maild-api:latest
    build: ./adminng/api/
    container_name: maild-api
    hostname: api
    restart: always
    # No published port: only the `adminng` frontend talks to the API, over the
    # compose network (/api/v1/ proxy).
    environment:
      # explicit on every DB consumer (see the note on the db service): the guard
      # makes a missing password fail at `compose config`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ADMINNG_SECRET_KEY: ${ADMINNG_SECRET_KEY:?set ADMINNG_SECRET_KEY in .env}
      # The api is the first-boot provisioning leader now (admin is retired): it seeds
      # DEFAULT_DOMAIN, the superadmin and the default aliases before uvicorn starts.
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      # quota usage = Maildir++ .maildirsize; the API never writes mail storage
      - vmail:/home/vmail:ro
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  adminng:
    image: pavelmc/maild-adminng:latest
    build: ./adminng/pwa/
    container_name: maild-adminng
    hostname: adminng
    restart: always
    # no env_file on purpose: static bundle + same-origin proxy to `api`.
    # No published port: exposed through the ingress proxy (Traefik labels below).
    depends_on:
      - api
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — https://adminng.${DEFAULT_DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.adminng.rule=Host(`adminng.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.adminng.entrypoints=websecure"
      - "traefik.http.routers.adminng.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.adminng.service=adminng_custom_port"
      - "traefik.http.services.adminng_custom_port.loadbalancer.server.port=80"
      #- "traefik.docker.network=maild"

  mua:
    image: pavelmc/maild-mua:latest
    build: ./mua/
    container_name: maild-mua
    hostname: mua
    restart: always
    environment:
      # SnappyMail's entrypoint writes the contacts DSN with this password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      - mua_web:/var/www/html/data
    depends_on:
      - mda
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — https://webmail.${DEFAULT_DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`webmail.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.webmail.entrypoints=websecure"
      - "traefik.http.routers.webmail.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.webmail.service=webmail_custom_port"
      - "traefik.http.services.webmail_custom_port.loadbalancer.server.port=80"
      #- "traefik.docker.network=maild"

  mda:
    image: pavelmc/maild-mda:latest
    build: ./mda/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-mda
    hostname: mda
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
    # DEFAULT_MAILBOX_SIZE (200M), the quota-report schedule and the self-signed
    # cert subject now default in the image; override them from .env when needed.
    # Operator env file; overrides any same-named image ENV default.
    env_file:
      - .env
    ports:
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
    depends_on:
      - db
    volumes:
      - vmail:/home/vmail
      - /certs:/certs
      - spool:/var/spool/
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  mta:
    image: pavelmc/maild-mta:latest
    build: ./mta/
    container_name: maild-mta
    domainname: ${DEFAULT_DOMAIN}
    hostname: mta
    restart: always
    environment:
      MAILADMIN: ${MAIL_ADMIN_USER:-sysadmin}@${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      DEBUG: 'true'
      # explicit on every DB consumer (see the note on the db service)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # MAX_MESSAGESIZE / SPF / DNSBL / peer timeouts now default in the image;
    # override them (or RELAY / ALWAYS_BCC / POSTMASTER_ABUSE_SETUP) from .env.
    # Operator env file; overrides any same-named image ENV default.
    env_file:
      - .env
    ports:
      - "25:25"    # SMTP
      - "465:465"  # SMTPS
      - "587:587"  # Submission
    volumes:
      - vmail:/home/vmail
      - /certs:/certs
      - spool:/var/spool/
    depends_on:
      - db
      - mda
      - amavis
      - clamav
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  clamav:
    image: pavelmc/maild-clamav:latest
    build: ./clamav/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-clamav
    hostname: clamav
    restart: always
    # no env_file on purpose: clamav needs no catalogue access (variable separation).
    # Its only knobs default unset in the image and are passed as explicit entries:
    # an empty value behaves exactly like unset for both (the entrypoint tests
    # them with `if [ "$VAR" ]`), so `${VAR:-}` is safe here.
    environment:
      ALTERNATE_MIRROR: ${ALTERNATE_MIRROR:-}
      CLAMAV_DEBUG: ${CLAMAV_DEBUG:-}
    volumes:
      - clamav:/var/lib/clamav
      - amavis:/var/lib/amavis
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  amavis:
    image: pavelmc/maild-amavis:latest
    build: ./amavis/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-amavis
    hostname: amavis
    restart: always
    environment:
      # explicit on every DB consumer (see the note on the db service): the entrypoint
      # queries the catalogue for the domain list
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # AV/SPAM/DKIM and the SpamAssassin tuning now default in the image; override
    # them from .env. Operator env file; overrides any same-named image ENV default.
    env_file:
      - .env
    volumes:
      - amavis:/var/lib/amavis
      - spamassassin:/var/lib/spamassassin
      - spool:/var/spool/
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  cron:
    image: pavelmc/maild-cron:latest
    build: ./cron/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-cron
    hostname: cron
    restart: always
    environment:
      # explicit on every DB consumer (see the note on the db service): the cron
      # scripts talk to the catalogue with psql; the resume/report jobs also need
      # the deployment coordinates (the entrypoint dumps the environment into
      # /etc/environment, from where every cron job sources it).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      - /var/log:/var/log
      - vmail:/home/vmail
      - db_backups:/backups
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
