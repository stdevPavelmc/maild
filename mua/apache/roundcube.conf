# MailD mua — Roundcube vhost.
#
# Only public_html/ is web-visible (Roundcube's own layout since 1.5): config/, program/, bin/,
# SQL/, vendor/ and the plugin PHP files are never served directly. Static assets of skins and
# plugins go through public_html/static.php, which only hands out whitelisted file types.
# TLS is terminated by the operator's ingress (production) — this vhost speaks plain HTTP.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/roundcube/public_html

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # public_html/.htaccess, inlined because AllowOverride is None. Roundcube already links
        # every skin/plugin asset through static.php/…, only the favicon needs a rewrite.
        RewriteEngine On
        RewriteRule ^favicon\.ico$ static.php/skins/elastic/images/favicon.ico [L]
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
            ExpiresByType font/woff2 "access plus 1 month"
        </IfModule>
    </Directory>

    # no dotfiles, no backups, no VCS leftovers anywhere
    <FilesMatch "^\.|~$|\.(bak|orig|swp|dist|sql|sh|log|inc)$">
        Require all denied
    </FilesMatch>

    # uploads: the PHP limit (upload_max_filesize) answers first; this is the hard ceiling
    LimitRequestBody 52428800

    ErrorLog /dev/stderr
    # behind the ingress %h is the proxy; Roundcube itself logs the real client (proxy_whitelist)
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" maild_combined
    CustomLog /dev/stdout maild_combined
</VirtualHost>
