; MailD SnappyMail PHP settings.
; Comments MUST use ';': the php.ini parser reads a '#' line as a bogus key/value pair and
; rejects the whole file as soon as such a line is not a valid "key = value".

date.timezone = UTC
upload_max_filesize = 24M
post_max_size = 25M

; PHP errors to the container log (docker compose logs mua): SnappyMail reports its own errors,
; but a PHP level failure -- an unparsable application.ini, for one -- is invisible otherwise
log_errors = On
error_log = /dev/stderr

; Errors must NEVER be printed into the response. SnappyMail sets its own headers (CSP,
; X-Frame-Options, cookies) and, on PHP 8.4+, its own code emits E_DEPRECATED -- e.g.
; "Constant E_STRICT is deprecated since 8.4" at MailSo/Log/Logger.php:153/171, referenced by
; SnappyMail's error-level map. Printed output makes every later header() call fail
; ("Cannot modify header information") and prefixes the JSON API with HTML, so the webmail
; dies in the browser (the login POST stops being valid JSON).
display_errors = Off

; SnappyMail 2.38.2 predates PHP 8.4 and therefore raises deprecations the app cannot fix
; (E_STRICT above, curl_close() in its HTTP client, ...). They are upstream's job, so keep them out
; of the log; every other level -- warnings, notices, fatals -- still reaches
; `docker compose logs mua` through log_errors/error_log above.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

