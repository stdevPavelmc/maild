; MailD SnappyMail PHP settings.
; Comments MUST use ';': the php.ini parser reads a '#' line as a bogus key/value pair and
; rejects the whole file as soon as such a line is not a valid "key = value".

date.timezone = UTC
upload_max_filesize = 24M
post_max_size = 25M

; PHP errors to the container log (docker compose logs mua): SnappyMail reports its own errors,
; but a PHP level failure -- an unparsable application.ini, for one -- is invisible otherwise
log_errors = On
error_log = /dev/stderr

; display_errors = On
; error_reporting = E_ALL

