# Security headers (the bundle is fully self-hosted; the QR is inline SVG, so
# no third-party origins are needed).
#
# IMPORTANT: nginx *replaces* the inherited add_header set as soon as a child
# block declares its own add_header. That is why this snippet is included both
# at server level (adminng-common.conf) and inside every location that sets a
# Cache-Control/Content-Disposition header — otherwise index.html, sw.js and the
# hashed assets would be served without CSP/X-Frame-Options.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
