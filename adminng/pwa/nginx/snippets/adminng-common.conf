# Shared server-level directives, included *inside* a server block by both the
# plain-HTTP vhost (default.conf) and the optional HTTPS listener (tls.conf).
# Keep the security headers in one place: a second, drifted copy is exactly how
# the TLS vhost would end up weaker than the HTTP one.

root /usr/share/nginx/html;
index index.html;

# Access log to stdout: dev uses the docker JSON driver, production the
# operator's pipeline. This is the transport-level audit complement to the
# application audit_event table (technical-draft §9).
access_log /dev/stdout;
error_log  /dev/stderr warn;

server_tokens off;
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

include snippets/adminng-headers.conf;
