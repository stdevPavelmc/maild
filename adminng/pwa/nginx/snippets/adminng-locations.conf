# Locations shared by the HTTP and HTTPS vhosts. Included *inside* a server
# block, after adminng-common.conf (which sets root/headers).

# --- API proxy (same-origin: the PWA needs no base-URL configuration) ---------
location /api/v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Device + re-auth headers reach the API untouched.
    proxy_set_header X-Device-ID               $http_x_device_id;
    proxy_set_header X-Security-Validation-Token $http_x_security_validation_token;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# The API's OpenAPI docs (FastAPI) are same-origin too.
location = /health {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
}

# --- Local CA download (Android certificate installer) -----------------------
# Only the *public* certificate is served, never the key. The phone needs the CA
# before it can trust the HTTPS listener, so this lives on the HTTP vhost as
# well. In production /certs is not mounted: these paths simply 404.
location = /ca.der {
    include snippets/adminng-headers.conf;
    alias /certs/adminng-ca.der;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition "attachment; filename=adminng-ca.der" always;
    add_header Cache-Control "no-store" always;
}
location = /ca.crt {
    include snippets/adminng-headers.conf;
    alias /certs/adminng-ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition "attachment; filename=adminng-ca.crt" always;
    add_header Cache-Control "no-store" always;
}

# --- Static PWA ---------------------------------------------------------------
# The shell and the service worker must never be cached hard: a stale
# index.html would pin clients to an old bundle.
location = /index.html {
    include snippets/adminng-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /sw.js {
    include snippets/adminng-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ~* \.(?:js|css|svg|png|webp|ico|woff2?)$ {
    include snippets/adminng-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
}

# SPA fallback.
location / {
    try_files $uri $uri/ /index.html;
}
