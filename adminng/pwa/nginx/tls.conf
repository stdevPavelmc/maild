# Optional HTTPS listener for LAN/dev use (host port 8084 in
# docker-compose-dev.yml). It is NOT part of the image's active configuration:
# the Dockerfile keeps it in /etc/nginx/tls-available/ and only the dev compose
# file mounts it into conf.d. Production keeps terminating TLS at the operator's
# ingress (AGENTS.md: adminng/mua carry Traefik labels, the stack terminates no
# TLS for them).
#
# Certificates: adminng.crt/adminng.key in the shared /certs volume, issued by
# the local CA created by tls-cert-generate.sh (adminng-ca.crt). The CA must be
# installed on the client device; Android: Settings -> Security -> Encryption &
# credentials -> Install a certificate -> CA certificate. The CA is downloadable
# from the plain-HTTP vhost at /ca.der.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/adminng.crt;
    ssl_certificate_key /certs/adminng.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    # ECDHE only: no DHE suites, so no ssl_dhparam dependency on the mail
    # volume's RSA2048.pem (which mda may not have generated yet).
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AdminNGTLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # No HSTS on purpose: the certificate is local, the LAN address can change
    # and the same host also serves plain HTTP on 8083 (harness + CA download).

    include snippets/adminng-common.conf;
    include snippets/adminng-locations.conf;
}
