# AdminNG frontend (service `adminng`): serves the built PWA and proxies
# /api/v1/ to the internal `api` service. This container is the only AdminNG
# component exposed to the outside world, so its access log is the exterior
# interaction record (docker logs adminng / the operator's log pipeline).
#
# TLS is NOT terminated here in production: the operator's ingress (Traefik,
# Nginx, ...) terminates it and reaches this container on port 80. The optional
# HTTPS listener lives in nginx/tls.conf; it is inactive in the image (kept in
# /etc/nginx/tls-available/) and only docker-compose-dev.yml mounts it into
# conf.d, for LAN devices that need a secure origin (dev host port 8084).

server {
    listen 80;
    server_name _;

    include snippets/adminng-common.conf;
    include snippets/adminng-locations.conf;
}
