# AdminNG frontend (service `adminng`): serves the built PWA and proxies
# /api/v1/ to the internal `api` service. This container is the only AdminNG
# component exposed to the outside world, so its access log is the exterior
# interaction record (docker logs adminng / the operator's log pipeline).
#
# TLS is NOT terminated here: in production the operator's ingress (Traefik,
# Nginx, ...) terminates it and reaches this container on port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Access log to stdout: dev uses the docker JSON driver, production the
    # operator's pipeline. This is the transport-level audit complement to the
    # application audit_event table (technical-draft §9).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # The bundle is fully self-hosted; the QR is inline SVG. No third-party origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- API proxy (same-origin: the PWA needs no base-URL configuration) -----
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Device + re-auth headers reach the API untouched.
        proxy_set_header X-Device-ID               $http_x_device_id;
        proxy_set_header X-Security-Validation-Token $http_x_security_validation_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The API's OpenAPI docs (FastAPI) are same-origin too.
    location = /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # --- Static PWA ----------------------------------------------------------
    # The shell and the service worker must never be cached hard: a stale
    # index.html would pin clients to an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|svg|png|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
