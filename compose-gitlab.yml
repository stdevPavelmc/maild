# GitLab Container Registry — driven by .gitlab-ci.yml (IMG_* / TAG variables).
# Sample pipeline: .gitlab-ci.yml — deploy with COMPOSE_FILE=compose-gitlab.yml.
#
# STRICT copy of docker-compose.yml: the ONLY difference is the image: lines (CI vars).

networks:
  maild:
    external: true

volumes:
  vmail:        # mail storage
  spool:        # temp mail storage
  clamav:       # AV storage
  amavis:       # filtering storage
  spamassassin: # spam data
  db:           # database storage
  mua_web:      # mua web data
  db_backups:   # database backups

services:
  db:
    image: ${IMG_DB}:${TAG}
    build: ./db/
    container_name: maild-db
    hostname: db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - vars/db.env
      - vars/mua.env
      - .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - maild

  admin:
    image: ${IMG_ADMIN}:${TAG}
    build: ./admin/
    container_name: maild-admin
    hostname: admin
    restart: always
    # No published port: the UI is exposed through the ingress proxy (Traefik labels below).
    environment:
      POSTFIXADMIN_DB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTFIXADMIN_SETUP_PASSWORD: ${POSTFIXADMIN_SETUP_PASSWORD}
    env_file:
      - vars/db.env
      - vars/admin.env
      - .env
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — http://mailadmin.${DEFAULT_DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.mailadmin.rule=Host(`mailadmin.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.mailadmin.entrypoints=websecure"
      - "traefik.http.routers.mailadmin.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.mailadmin.service=mailadmin_custom_port"
      - "traefik.http.services.mailadmin_custom_port.loadbalancer.server.port=80"
      # optional: pin the network Traefik must use when the container joins several
      #- "traefik.docker.network=maild"

  mua:
    image: ${IMG_MUA}:${TAG}
    build: ./mua/
    container_name: maild-mua
    hostname: mua
    restart: always
    environment:
      # production parity: SnappyMail's entrypoint writes the contacts DSN with this password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - vars/db.env
      - vars/mua.env
      - .env
    volumes:
      - mua_web:/var/www/html/data
    depends_on:
      - mda
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — https://webmail.${DEFAULT_DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`webmail.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.webmail.entrypoints=websecure"
      - "traefik.http.routers.webmail.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.webmail.service=webmail_custom_port"
      - "traefik.http.services.webmail_custom_port.loadbalancer.server.port=80"
      #- "traefik.docker.network=maild"

  mda:
    image: ${IMG_MDA}:${TAG}
    build: ./mda/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-mda
    hostname: mda
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN}
      DEFAULT_MAILBOX_SIZE: ${DEFAULT_MAILBOX_SIZE}
    env_file:
      - vars/db.env
      - vars/mda.env
      - vars/ssl.env
      - .env
    ports:
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
    depends_on:
      - db
    volumes:
      - vmail:/home/vmail
      - /certs:/certs
      - spool:/var/spool/
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  mta:
    image: ${IMG_MTA}:${TAG}
    build: ./mta/
    container_name: maild-mta
    domainname: ${DEFAULT_DOMAIN}
    hostname: mta
    restart: always
    environment:
      MAILADMIN: ${MAIL_ADMIN_USER}@${DEFAULT_DOMAIN}
      DEBUG: 'true'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - vars/mta.env
      - vars/ssl.env
      - vars/db.env
      - .env
    ports:
      - "25:25"    # SMTP
      - "465:465"  # SMTPS
      - "587:587"  # Submission
    volumes:
      - vmail:/home/vmail
      - /certs:/certs
      - spool:/var/spool/
    depends_on:
      - db
      - mda
      - amavis
      - clamav
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  clamav:
    image: ${IMG_CLAMAV}:${TAG}
    build: ./clamav/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-clamav
    hostname: clamav
    restart: always
    env_file:
      - vars/clamav.env
    volumes:
      - clamav:/var/lib/clamav
      - amavis:/var/lib/amavis
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  amavis:
    image: ${IMG_AMAVIS}:${TAG}
    build: ./amavis/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-amavis
    hostname: amavis
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - vars/amavis.env
      - vars/db.env
      - .env
    volumes:
      - amavis:/var/lib/amavis
      - spamassassin:/var/lib/spamassassin
      - spool:/var/spool/
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  cron:
    image: ${IMG_CRON}:${TAG}
    build: ./cron/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-cron
    hostname: cron
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - vars/db.env
      - vars/amavis.env
      - .env
    volumes:
      - /var/log:/var/log
      - vmail:/home/vmail
      - db_backups:/backups
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
