# GitLab Container Registry — driven by .gitlab-ci.yml (IMG_* / TAG variables).
# Sample pipeline: .gitlab-ci.yml — deploy with COMPOSE_FILE=compose-gitlab.yml.
#
# STRICT copy of docker-compose.yml: the ONLY difference is the image: lines (CI vars).

networks:
  maild:
    external: true

volumes:
  vmail:        # mail storage
  spool:        # temp mail storage
  clamav:       # AV storage
  amavis:       # filtering storage
  spamassassin: # spam data
  db:           # database storage
  mua_web:      # mua web data
  db_backups:   # database backups
  mcp_logs:     # mcp audit/access/error logs

services:
  db:
    image: ${IMG_DB}:${TAG}
    build: ./db/
    container_name: maild-db
    hostname: db
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    environment:
      # explicit on every DB consumer: compose interpolation does not read env_file
      # contents, and the guard makes a missing password fail at `compose config`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # MailD MCP role (db/ensure_roles.sh); empty = no MCP role, the stack still boots
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - maild

  api:
    image: ${IMG_API}:${TAG}
    build: ./adminng/api/
    container_name: maild-api
    hostname: api
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    # No published port: only the `adminng` frontend talks to the API, over the
    # compose network (/api/v1/ proxy).
    environment:
      # explicit on every DB consumer (see the note on the db service): the guard
      # makes a missing password fail at `compose config`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ADMINNG_SECRET_KEY: ${ADMINNG_SECRET_KEY:?set ADMINNG_SECRET_KEY in .env}
      # The api is the first-boot provisioning leader now (admin is retired): it seeds
      # DEFAULT_DOMAIN, the superadmin and the default aliases before uvicorn starts.
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      # quota usage = Maildir++ .maildirsize; the API never writes mail storage
      - vmail:/home/vmail:ro
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  adminng:
    image: ${IMG_ADMINNG}:${TAG}
    build: ./adminng/pwa/
    container_name: maild-adminng
    hostname: adminng
    restart: always
    # no env_file on purpose: static bundle + same-origin proxy to `api`.
    # No published port: exposed through the ingress proxy (Traefik labels below).
    depends_on:
      - api
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — https://admin.${DEFAULT_DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.adminng.rule=Host(`admin.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.adminng.entrypoints=websecure"
      - "traefik.http.routers.adminng.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.adminng.service=adminng_custom_port"
      - "traefik.http.services.adminng_custom_port.loadbalancer.server.port=80"
      #- "traefik.docker.network=maild"

  mua:
    image: ${IMG_MUA}:${TAG}
    build: ./mua/
    container_name: maild-mua
    hostname: mua
    restart: always
    environment:
      # SnappyMail's entrypoint writes the contacts DSN with this password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # operator env file (from env.sample); overrides any same-named image ENV default
    env_file:
      - .env
    volumes:
      - mua_web:/var/www/html/data
    depends_on:
      - mda
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — https://webmail.${DEFAULT_DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`webmail.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.webmail.entrypoints=websecure"
      - "traefik.http.routers.webmail.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.webmail.service=webmail_custom_port"
      - "traefik.http.services.webmail_custom_port.loadbalancer.server.port=80"
      #- "traefik.docker.network=maild"

  mda:
    image: ${IMG_MDA}:${TAG}
    build: ./mda/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-mda
    hostname: mda
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
      # MailD MCP Dovecot master user (IMAP only); empty = no master user
      MCP_DOVECOT_MASTER_PASSWORD: ${MCP_DOVECOT_MASTER_PASSWORD:-}
    # DEFAULT_MAILBOX_SIZE (200M), the quota-report schedule and the self-signed
    # cert subject now default in the image; override them from .env when needed.
    # Operator env file; overrides any same-named image ENV default.
    env_file:
      - .env
    ports:
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
    depends_on:
      - db
    volumes:
      - vmail:/home/vmail
      - /certs:/certs
      - spool:/var/spool/
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  mta:
    image: ${IMG_MTA}:${TAG}
    build: ./mta/
    container_name: maild-mta
    domainname: ${DEFAULT_DOMAIN}
    hostname: mta
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    environment:
      MAILADMIN: ${MAIL_ADMIN_USER:-sysadmin}@${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      DEBUG: 'true'
      # explicit on every DB consumer (see the note on the db service)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # MAX_MESSAGESIZE / SPF / DNSBL / peer timeouts now default in the image;
    # override them (or RELAY / ALWAYS_BCC / POSTMASTER_ABUSE_SETUP) from .env.
    # Operator env file; overrides any same-named image ENV default.
    env_file:
      - .env
    ports:
      - "25:25"    # SMTP
      - "465:465"  # SMTPS
      - "587:587"  # Submission
    volumes:
      - vmail:/home/vmail
      - /certs:/certs
      - spool:/var/spool/
    depends_on:
      - db
      - mda
      - amavis
      - clamav
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  clamav:
    image: ${IMG_CLAMAV}:${TAG}
    build: ./clamav/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-clamav
    hostname: clamav
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    # no env_file on purpose: clamav needs no catalogue access (variable separation).
    # Its only knobs default unset in the image and are passed as explicit entries:
    # an empty value behaves exactly like unset for both (the entrypoint tests
    # them with `if [ "$VAR" ]`), so `${VAR:-}` is safe here.
    environment:
      ALTERNATE_MIRROR: ${ALTERNATE_MIRROR:-}
      CLAMAV_DEBUG: ${CLAMAV_DEBUG:-}
    volumes:
      - clamav:/var/lib/clamav
      - amavis:/var/lib/amavis
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  amavis:
    image: ${IMG_AMAVIS}:${TAG}
    build: ./amavis/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-amavis
    hostname: amavis
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    environment:
      # explicit on every DB consumer (see the note on the db service): the entrypoint
      # queries the catalogue for the domain list
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # AV/SPAM/DKIM and the SpamAssassin tuning now default in the image; override
    # them from .env. Operator env file; overrides any same-named image ENV default.
    env_file:
      - .env
    volumes:
      - amavis:/var/lib/amavis
      - spamassassin:/var/lib/spamassassin
      - spool:/var/spool/
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  cron:
    image: ${IMG_CRON}:${TAG}
    build: ./cron/
    domainname: ${DEFAULT_DOMAIN}
    container_name: maild-cron
    hostname: cron
    restart: always
    labels:
      # internal service: never routed by the ingress, even when Traefik runs with
      # exposedByDefault=true (2026-10 audit M-05)
      - "traefik.enable=false"
    environment:
      # NO env_file on purpose (2026-10 audit M-06): the operator file carries every
      # service's secrets and the entrypoint writes this environment to /etc/environment
      # (mode 600), from where every cron job sources it. Allow-list, the mcp pattern:
      # a new cron tunable must be added here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
      # optional tunables: bare keys pass the value from the operator file through and stay
      # UNSET when it is absent, so the image ENV default applies
      POSTGRES_HOST:
      POSTGRES_PORT:
      POSTGRES_DB:
      POSTGRES_USER:
      ADMINNG_DB:
      MCP_DB:
      MTA:
      AMAVIS_SUBMIT_PORT:
      MX_HOSTNAME:
      BACKUP_MIN_BYTES:
      JUNK_RETENTION_DAYS:
      SA_HAM_SAMPLE_PER_USER:
      SA_HAM_SAMPLE_MAX:
      OUTBOUND_ALERT_MESSAGES:
      OUTBOUND_ALERT_IGNORE_USERS:
      DNS_CHECK_DOMAINS:
      DNS_CHECK_TO:
      DNS_CHECK_ALERT_LEVEL:
      DNS_CHECK_RESOLVER:
      DNS_CHECK_BLOCKLISTS:
      DNS_CHECK_IP_BLOCKLISTS:
      DNS_CHECK_DKIM:
      DNS_CHECK_SPF_MX_COVERAGE:
      DNS_CHECK_TIMEOUT:
    volumes:
      - /var/log:/var/log
      - vmail:/home/vmail
      - db_backups:/backups
      # read-only view of the DKIM keys Amavis signs with: check_dns.sh compares every
      # domain's published selector/key against the real key (it never writes here)
      - amavis:/var/lib/amavis:ro
    depends_on:
      - db
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"

  mcp:
    image: ${IMG_MCP}:${TAG}
    build: ./mcp/
    container_name: maild-mcp
    hostname: mcp
    restart: always
    # NO env_file on purpose (mcp/progress.md P0, 2026-10-29): the operator file carries
    # POSTGRES_PASSWORD and every other service's secrets, and the mcp connects to the db only
    # as the restricted MCP_DB_USER role (D8). Allow-list: a new MCP_* tunable must be added here.
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:?set DEFAULT_DOMAIN in .env}
      MAIL_ADMIN_USER: ${MAIL_ADMIN_USER:-sysadmin}
      MCP_SECRET_KEY: ${MCP_SECRET_KEY:?set MCP_SECRET_KEY in .env}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?set MCP_DB_PASSWORD in .env}
      MCP_DOVECOT_MASTER_PASSWORD: ${MCP_DOVECOT_MASTER_PASSWORD:?set MCP_DOVECOT_MASTER_PASSWORD in .env}
      # optional tunables: bare keys pass the value from the operator file through and stay
      # UNSET when it is absent, so the image ENV default applies
      MCP_DB:
      MCP_DB_USER:
      MCP_HOSTNAME:
      MCP_PUBLIC_URL:
      MCP_TRUSTED_PROXIES:
      MCP_SMTP_HOST:
      MCP_SMTP_PORT:
      MCP_ACCESS_TTL:
      MCP_USER_SESSION_TTL:
      MCP_ADMIN_SESSION_TTL:
      MCP_MASTER_TOKEN_MAX_TTL:
      MCP_OAUTH_ACCESS_TTL:
      MCP_OAUTH_REFRESH_TTL:
      MCP_SEND_RATE_RECIPIENTS:
      MCP_SEND_RATE_WINDOW:
      # the mta's message-size limit, applied by the MCP before it submits
      MAX_MESSAGESIZE:
      MCP_ADMIN_USER:
      MCP_ADMIN_PASSWORD:
      MCP_ADMIN_EMAIL:
      MCP_SERVICE_EMAIL:
      MCP_SERVICE_PASSWORD:
      MCP_DOVECOT_MASTER_USER:
      MCP_IMAP_HOST:
      MCP_IMAP_PORT:
      MCP_IMAP_CA_FILE:
      MCP_WORKERS:
      MCP_DEBUG:
      POSTGRES_HOST:
      POSTGRES_PORT:
      POSTGRES_DB:
      PROVISION_WAIT_TIMEOUT:
    # No published port: exposed through the ingress proxy (Traefik labels below).
    volumes:
      - mcp_logs:/var/log/maild-mcp
      # verifies the STARTTLS certificate of mda:143 (the mcp never mounts mail storage)
      - /certs:/certs:ro
    depends_on:
      - db
      - mda
      - amavis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - maild
    logging: # See https://docs.docker.com/config/containers/logging/syslog/
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
    labels:
      # Ingress (Traefik) — https://${MCP_HOSTNAME:-mcp.${DEFAULT_DOMAIN}}
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`${MCP_HOSTNAME:-mcp.${DEFAULT_DOMAIN}}`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      # custom service (non default port)
      - "traefik.http.routers.mcp.service=mcp_custom_port"
      - "traefik.http.services.mcp_custom_port.loadbalancer.server.port=8080"
      #- "traefik.docker.network=maild"
