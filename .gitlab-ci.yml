    - docker tag ${IMG_MDA}:${TAG} ${IMG_MDA}:latest
    - export TAG=latest
    - docker compose push mda
  needs:
    - build_mda
  tags:
    - mails
  rules:
    !reference [.rule_mda, rules]

# Release amavis
release_amavis:
  stage: release
  <<: *before_script
  script:
    - docker compose pull amavis
    - docker tag ${IMG_AMAVIS}:${TAG} ${IMG_AMAVIS}:latest
    - export TAG=latest
    - docker compose push amavis
  needs:
    - build_amavis
  tags:
    - mails
  rules:
    !reference [.rule_amavis, rules]

# Release clamav
release_clamav:
  stage: release
  <<: *before_script
  script:
    - docker compose pull clamav
    - docker tag ${IMG_CLAMAV}:${TAG} ${IMG_CLAMAV}:latest
    - export TAG=latest
    - docker compose push clamav
  needs:
    - build_clamav
  tags:
    - mails
  rules:
    !reference [.rule_clamav, rules]

# Release mua
release_mua:
  stage: release
  <<: *before_script
  script:
    - docker compose pull mua
    - docker tag ${IMG_MUA}:${TAG} ${IMG_MUA}:latest
    - export TAG=latest
    - docker compose push mua
  needs:
    - build_mua
  tags:
    - mails
  rules:
    !reference [.rule_mua, rules]

# Release cron
release_cron:
  stage: release
  <<: *before_script
  script:
    - docker compose pull cron
    - docker tag ${IMG_CRON}:${TAG} ${IMG_CRON}:latest
    - export TAG=latest
    - docker compose push cron
  needs:
    - build_cron
  tags:
    - mails
  rules:
    !reference [.rule_cron, rules]

# Deploy
deploy:
  stage: deploy
  <<: *before_script
  script:
    - export TAG=latest
    - export DOCKER_HOST=$DOCKER_SERVER
    - export DOCKER_TLS_VERIFY="true"
    - export DOCKER_CERT_PATH=$CERT_PATH
    - docker compose pull
    - docker compose up -d
  only:
    - main
  needs:
    - job: release_mta
      optional: true
    - job: release_mda
      optional: true
    - job: release_db
      optional: true
    - job: release_amavis
      optional: true
    - job: release_clamav
      optional: true
    - job: release_mua
      optional: true
    - job: release_cron
      optional: true
    - job: release_api
      optional: true
    - job: release_adminng
      optional: true
  tags:
    - mails
