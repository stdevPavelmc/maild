---
image: docker:28

variables:
  # To use DIND
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  # Deploy env vars
  CERT_PATH: "/cert"

  # The GitLab specific compose file (image names come from the IMG_* vars below).
  # Without this every `docker compose …` call would fall back to docker-compose.yml.
  COMPOSE_FILE: compose-gitlab.yml

  # this vars needs to get loaded from the env
  # DOCKER_SERVER

  # local images — keep the maild-<svc> naming used by every compose file
  IMG_DB: "$CI_REGISTRY_IMAGE/maild-db"
  IMG_MTA: "$CI_REGISTRY_IMAGE/maild-mta"
  IMG_MDA: "$CI_REGISTRY_IMAGE/maild-mda"
  IMG_MUA: "$CI_REGISTRY_IMAGE/maild-mua"
  IMG_CLAMAV: "$CI_REGISTRY_IMAGE/maild-clamav"
  IMG_AMAVIS: "$CI_REGISTRY_IMAGE/maild-amavis"
  IMG_CRON: "$CI_REGISTRY_IMAGE/maild-cron"
  IMG_API: "$CI_REGISTRY_IMAGE/maild-api"
  IMG_ADMINNG: "$CI_REGISTRY_IMAGE/maild-adminng"

  # default TAG is dev
  TAG: dev

services:
  - name: docker:28-dind

before_script:
  - docker info

stages:
  - build
  - release
  - deploy
  - cleanup

# Before script template
.before_script_template: &before_script
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Registry Image:" $CI_REGISTRY_IMAGE
    # deploy env file (new schema): the images carry every default, so the env
    # file only needs the CI/CD-defined values. The mandatory ones (DEFAULT_DOMAIN,
    # MAIL_ADMIN_USER, POSTGRES_PASSWORD) must be defined as (masked) CI/CD
    # variables; anything not defined simply stays commented in the template and
    # the image defaults apply. compose needs the file present to resolve the
    # env_file list, so the template is always dumped.
    - cat env.sample_gitlab > .env
    - env | grep -E '^(DEFAULT_DOMAIN|MAIL_ADMIN_USER|POSTGRES_PASSWORD|ADMINNG_SECRET_KEY|MAIL_ADMIN_PASSWORD|MUA_ADMIN_USER|MUA_ADMIN_PASSWORD|AUTO_PROVISION|PROVISION_VERSION|PROVISION_WAIT_TIMEOUT|PROVISION_FORCE)=' >> .env || true

## Rules (defaults live in the Dockerfiles now, so no vars/*.env paths)
.rule_db:
  rules:
    - changes:
        - db/**/*

.rule_api:
  rules:
    - changes:
        - adminng/api/**/*

.rule_adminng:
  rules:
    - changes:
        - adminng/pwa/**/*

.rule_mta:
  rules:
    - changes:
        - mta/**/*

.rule_mda:
  rules:
    - changes:
        - mda/**/*

.rule_amavis:
  rules:
    - changes:
        - amavis/**/*

.rule_clamav:
  rules:
    - changes:
        - clamav/**/*

.rule_mua:
  rules:
    - changes:
        - mua/**/*

.rule_cron:
  rules:
    - changes:
        - cron/**/*

## Build

# admin db
build_db:
  stage: build
  <<: *before_script
  script:
    - docker compose build db --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_db, rules]

# api (AdminNG backend)
build_api:
  stage: build
  <<: *before_script
  script:
    - docker compose build api --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_api, rules]

# adminng (AdminNG PWA frontend)
build_adminng:
  stage: build
  <<: *before_script
  script:
    - docker compose build adminng --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_adminng, rules]

# mta
build_mta:
  stage: build
  <<: *before_script
  script:
    - docker compose build mta --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_mta, rules]

# mda
build_mda:
  stage: build
  <<: *before_script
  script:
    - docker compose build mda --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_mda, rules]

# amavis
build_amavis:
  stage: build
  <<: *before_script
  script:
    - docker compose build amavis --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_amavis, rules]

# clamav
build_clamav:
  stage: build
  <<: *before_script
  script:
    - docker compose build clamav --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_clamav, rules]

# mua
build_mua:
  stage: build
  <<: *before_script
  script:
    - docker compose build mua --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_mua, rules]

# cron
build_cron:
  stage: build
  <<: *before_script
  script:
    - docker compose build cron --push
  needs: []
  tags:
    - mails
  rules:
    !reference [.rule_cron, rules]

## Release

# Release db
release_db:
  stage: release
  <<: *before_script
  script:
    - echo build_debug $JOB_STATUS["build_debug"]
    - echo build_db $JOB_STATUS["build_db"]
    - docker compose pull db
    - docker tag ${IMG_DB}:${TAG} ${IMG_DB}:latest
    - export TAG=latest
    - docker compose push db
  needs:
    - build_db
  tags:
    - mails
  rules:
    !reference [.rule_db, rules]

# Release api (AdminNG backend)
release_api:
  stage: release
  <<: *before_script
  script:
    - docker compose pull api
    - docker tag ${IMG_API}:${TAG} ${IMG_API}:latest
    - export TAG=latest
    - docker compose push api
  needs:
    - build_api
  tags:
    - mails
  rules:
    !reference [.rule_api, rules]

# Release adminng (AdminNG PWA frontend)
release_adminng:
  stage: release
  <<: *before_script
  script:
    - docker compose pull adminng
    - docker tag ${IMG_ADMINNG}:${TAG} ${IMG_ADMINNG}:latest
    - export TAG=latest
    - docker compose push adminng
  needs:
    - build_adminng
  tags:
    - mails
  rules:
    !reference [.rule_adminng, rules]

# Release mta
release_mta:
  stage: release
  <<: *before_script
