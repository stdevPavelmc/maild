; MailD mua2 — PHP settings for Roundcube (apache2 mod_php and the CLI used by the entrypoint).
; Comments MUST use ';' (the php.ini parser rejects '#' lines that are not key = value).

date.timezone = UTC
expose_php = Off
memory_limit = 256M
max_execution_time = 120

; uploads: Roundcube's attachment limit follows these; keep them under the MTA message size
; (the entrypoint rewrites both from ROUNDCUBE_UPLOAD_MAX on every boot)
upload_max_filesize = 24M
post_max_size = 25M
file_uploads = On
upload_tmp_dir = /tmp/roundcube

; errors go to the container log, never into a response. error_log stays UNSET on purpose:
; mod_php then writes to Apache's ErrorLog (/dev/stderr, opened by the root parent) and the CLI to
; stderr. A www-data child cannot reopen /dev/stderr itself, so error_log=/dev/stderr loses them.
log_errors = On
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

; sessions: Roundcube keeps them in its database, these only harden the cookie
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
session.auto_start = 0
session.gc_maxlifetime = 21600

; no remote includes; outbound HTTP (CSS proxy) goes through Guzzle/curl, not fopen wrappers
allow_url_fopen = Off
allow_url_include = Off

; Roundcube runs no external commands in this image (no ImageMagick, no gpg, no aspell,
; no shell password drivers), so a code-execution bug cannot reach a shell through PHP
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

; zend.exception_ignore_args keeps arguments (passwords!) out of logged stack traces
zend.exception_ignore_args = On

opcache.enable = 1
opcache.validate_timestamps = 0
