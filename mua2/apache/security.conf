# MailD mua2 — server-wide Apache hardening (REPLACES Debian's conf-available/security.conf, which
# the Dockerfile disables: loaded after this file it would set ServerTokens OS again; its
# defaults are ServerTokens OS / ServerSignature On).
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size

# Roundcube sets X-Frame-Options and its own CSP-ish headers from PHP (x_frame_options);
# these complement them for every response, static assets included.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always unset X-Powered-By
</IfModule>

# the container log, for the server and for PHP (mod_php writes error_log() and its own errors
# to the server's error log; Debian's default is /var/log/apache2/error.log, invisible here)
ServerName localhost
ErrorLog /dev/stderr
