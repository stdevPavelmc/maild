# MailD: instant Bayes learning through imapsieve.
#
# When the user moves a message into Junk, Dovecot runs the global learn-spam sieve
# script; when they move one out of Junk (a false positive correction) it runs
# learn-ham. Both pipe :copy the message to the helpers in
# /usr/lib/dovecot/sieve-pipe (see 90-sieve-extprograms.conf), which run sa-learn.
#
# Dovecot 2.4 (resolute) replaced the 2.3 `imapsieve_mailboxN_*` plugin settings
# with script storages attached to a mailbox, and a top-level `imapsieve_from`
# section for the "leaving the mailbox" direction. The 2.3 configuration was:
#
#   imapsieve_mailbox1_name   = Junk      imapsieve_mailbox1_causes  = COPY
#   imapsieve_mailbox1_before = file:/etc/dovecot/sieve/learn-spam.sieve
#   imapsieve_mailbox2_name   = *         imapsieve_mailbox2_from    = Junk
#   imapsieve_mailbox2_causes = COPY
#   imapsieve_mailbox2_before = file:/etc/dovecot/sieve/learn-ham.sieve
#
# which is exactly what follows in 2.4 syntax. Both scripts are run BEFORE the
# operation (type = before, the 2.3 `_before` suffix) and for COPY causes only.
#
# bin_path: pigeonhole compiles a script on first use and, by default, caches the
# binary next to the source (`/etc/dovecot/sieve/learn-spam.svbin`). The imap
# process runs as vmail, /etc/dovecot/sieve is root:root 0775 (it holds the global
# filters every mailbox runs, so it must stay read-only for the mail user), and the
# save therefore failed on every Junk copy:
#
#   Error: sieve: binary /etc/dovecot/sieve/learn-spam.svbin: save: failed to create
#   temporary file: open(/etc/dovecot/sieve/learn-spam.svbin.) failed: Permission
#   denied (euid=5000(vmail) egid=5000(vmail) ... dir owned by 0:0 mode=0775)
#
# The script still ran (the learning worked), but it was recompiled on every load
# and each copy logged that error. bin_path is the *directory* holding the compiled
# binaries (the file name comes from the script name); it is created root:vmail 0770
# in the Dockerfile, so vmail can cache the binary while the .sieve sources stay
# immutable for it.

namespace inbox {
  mailbox Junk {
    sieve_script learn_spam {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/learn-spam.sieve
      bin_path = /var/lib/dovecot/sieve/imapsieve
    }
  }
}

# Messages copied OUT of Junk (the mailbox2_from = Junk of 2.3): any destination
# mailbox, that is why this one is a top-level section and not a mailbox filter.
# (2.3 spelled this "mailbox2_name = *", i.e. every mailbox).
imapsieve_from Junk {
  sieve_script learn_ham {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/learn-ham.sieve
    bin_path = /var/lib/dovecot/sieve/imapsieve
  }
}
