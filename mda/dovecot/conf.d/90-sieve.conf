##
## Settings for the Sieve interpreter
##

# Do not forget to enable the Sieve plugin in 15-lda.conf and 20-lmtp.conf
# by adding it to the respective mail_plugins= settings.
#
# Dovecot 2.4 (resolute) replaced the flat `sieve*` location settings and the
# `plugin { ... }` block with named script storages. The three MailD used map as:
#
#   2.3                                      2.4
#   sieve = ~/dovecot.sieve                  sieve_script personal { active_path = ~/dovecot.sieve }
#   sieve_dir = ~/sieve                      sieve_script personal { path = ~/sieve }
#   sieve_default = .../default.sieve        sieve_script default { type = default ... }
#
# Two 2.3 settings were dropped on purpose: `sieve_global_path` (a global script that
# never existed in the image: the container only ships sieve/learn-*.sieve) and
# `sieve_user_log` (2.4 removed it: a script error now lands in the container log).
# The `plugin {}` catch-all section no longer exists either, hence the flat settings
# at the bottom of this file.

# The user's main Sieve script (the active one, used by the LDA at delivery) and the
# storage holding their scripts (this is also what the ManageSieve service uses).
sieve_script personal {
  type = personal
  driver = file
  path = ~/sieve
  active_path = ~/dovecot.sieve
}

# The default Sieve script, run ONLY when the user has no personal script. MailD's
# entrypoint writes it at start-up (fileinto "Junk" for X-Spam-Flag: YES) and
# pre-compiles it with sievec.
sieve_script default {
  type = default
  sieve_script_name = default
  driver = file
  path = /var/lib/dovecot/sieve/default.sieve
}

# Location for ":global" include scripts as used by the "include" extension.
sieve_script global {
  type = global
  driver = file
  path = /etc/dovecot/sieve/global/
}

# Maximum size of a Sieve script (the ManageSieve default is 1M, MailD allows more)
sieve_max_script_size = 10M

# Maximum number of actions a script can perform (0 = unlimited)
sieve_max_actions = 0

# Maximum number of redirect actions (default is 4, MailD allows more)
sieve_max_redirects = 20

# Specifies what envelope sender address is used for redirected messages.
# "sender" = the sender address is used (default)
sieve_redirect_envelope_from = sender

## TRACE DEBUGGING
# Trace debugging provides detailed insight in the operations performed by the Sieve
# script, for both the LDA and the IMAPSIEVE plugin.
# WARNING: on a busy server this can fill up the trace directory quickly, so it is
# meant to be enabled temporarily and as selectively as possible.
#
# The directory where trace files are written (disabled when unset or missing); it
# defaults to the user's home if relative or starting with "~/".
#sieve_trace_dir =

# The verbosity level of the trace messages (trace debugging is disabled if unset):
#   "actions"  - only executed action commands (keep, fileinto, reject, redirect)
#   "commands" - any executed command except tests
#   "tests"    - all commands and tests
#   "matching" - everything, including the values matched by the tests
sieve_trace_level = matching

# Enables highly verbose debugging messages that are usually only useful for developers
sieve_trace_debug = yes

# Enables showing byte code addresses in the trace output instead of only the source
# line numbers
#sieve_trace_addresses = no

# Declare postmaster for rejected email bounces (2.4 variable syntax)
postmaster_address = postmaster@%{user | domain}

# Sieve uses the sendmail program to send outgoing mails (MailD ships a wrapper that
# logs the LMTP deliveries it makes)
sendmail_path = /usr/sbin/sendmail
