# anvil: the penalty/concurrency service that LMTP and the LDA consult for each recipient
# (lmtp_user_concurrency_limit). Dovecot 2.4.1 raised that setting's default from
# unlimited to 10 concurrent deliveries per user; our dovecot.conf pins
# `dovecot_config_version = 2.4.0`, so the effective limit here stays 0 (unlimited), but
# 2.4's LMTP still issues the anvil lookup on every delivery.
#
# Dovecot 2.4 runs anvil as root and creates /run/dovecot/anvil as `srw------- root:root`.
# Upstream commit beca41cc ("anvil: Change anvil socket's default group to
# default_internal_group") relaxes that to 0660 + group dovecot, but it landed after
# 2.4.2 — the version ubuntu:resolute ships, so it is not in our image. Because this
# stack runs the whole lmtp service as vmail (10-master.conf, `service lmtp { user =
# vmail }`), every delivery logged:
#
#   lmtp(1178): Error: conn unix:/run/dovecot/anvil: net_connect_unix(/run/dovecot/anvil) failed: Permission denied
#   lmtp(1178): Error: lmtp-server: conn ...: rcpt x@y: lmtp_user_concurrency_limit lookup failed - skipping
#
# Mail was still delivered (the lookup is best-effort and gets skipped), but the per-user
# concurrency limit was silently ignored and the two lines repeated for every recipient.
#
# Same treatment as the stats sockets in 90-stats-perms.conf: hand the listener to the
# mail user (uid/gid 5000, see mail_uid/mail_gid in 10-mail.conf). The anvil process
# itself keeps running as root; only the socket becomes reachable by vmail.

service anvil {
    unix_listener anvil {
        user = vmail
        group = vmail
        mode = 0660
    }
}
