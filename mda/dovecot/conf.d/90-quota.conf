##
## Quota configuration.
##

# Note that you also have to enable quota plugin in mail_plugins setting.
# <https://doc.dovecot.org/latest/core/plugins/quota.html>
#
# Dovecot 2.4 (resolute) dropped the 2.3 `plugin { quota = maildir:User quota ... }`
# syntax and the `dict`/`dirsize` backends: a quota is now a *named quota root*
# configured with the same names as the settings (storage_size, storage_grace,
# storage_extra, warning...). MailD keeps the `maildir` (Maildir++) driver, so the
# `.maildirsize` accounting already on disk keeps being used; the per-user limit
# keeps coming from PostfixAdmin's `quota` column, which userdb returns as
# `quota_storage_size` (see auth-sql.conf.ext). The root name stays "User quota":
# `doveadm quota get` prints it and test.sh parses that output.

##
## Quota service
##

# Postfix policy service: what makes a full mailbox bounce at RCPT time
service quota-status {
    executable = quota-status -p postfix
    inet_listener quota-status {
        port = 12340
    }
    client_limit = 1
}

##
## Quota limits
##

quota "User quota" {
  driver = maildir
  # Fallback for a mailbox with no limit in the catalogue (quota = 0)
  storage_size = 100M

  # LDA/LMTP allows saving the last mail to bring the user from under to over quota,
  # if the quota does not grow too high. 2.3 expressed this as 10%% *of the limit*;
  # 2.4 only takes an absolute size, so this is 10% of the default 200M mailbox
  # (DEFAULT_MAILBOX_SIZE). See Changelog.md.
  storage_grace = 20M

  # Quota warnings live inside the quota root in 2.4 (`warning <name>` filters,
  # highest threshold first). Each one runs the `quota-warning` service with the
  # arguments the script expects: $1 = percentage, $2 = user.
  warning warn95 {
    quota_storage_percentage = 95
    execute quota-warning {
      args = 95 %{user}
    }
  }
  warning warn80 {
    quota_storage_percentage = 80
    execute quota-warning {
      args = 80 %{user}
    }
  }
}

namespace inbox {
  # Extra 10M when saving to Trash (2.3: quota_rule2 = Trash:storage=+10M)
  mailbox Trash {
    quota_storage_extra = 10M
  }
}

# Quota plugin can also limit the maximum accepted mail size.
quota_mail_size = 100M

# flexible handling
quota_status_success = DUNNO
quota_status_nouser = DUNNO

# reject message
quota_status_overquota = "552 5.2.2 Mailbox is full / Buzon de correo Lleno"

##
## Quota warnings
##

# The quota-warning service mails the mailbox owner when a threshold is crossed. The
# unix listener's permissions must let the mail processes connect to it: mode 0666
# allows any of them (the script itself runs as root and drops privileges for the LDA
# delivery it performs).
service quota-warning {
  executable = script /etc/dovecot/scripts/quota-warning.sh
  user = root
  unix_listener quota-warning {
    user = dovecot
    mode = 0666
  }
}
