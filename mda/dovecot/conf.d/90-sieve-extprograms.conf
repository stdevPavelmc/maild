# Sieve Extprograms plugin configuration
#
# MailD uses it for the imapsieve antispam learning: the global learn-spam/learn-ham
# scripts (see 90-imapsieve.conf) pipe :copy each message to a helper living in
# sieve_pipe_bin_dir, which runs sa-learn. Dovecot 2.4 removed the `plugin { }`
# catch-all section, so the settings below are top-level now.
#
# Don't forget to add the sieve_extprograms plugin to the sieve_plugins setting.
# Also enable the extensions you need (one or more of vnd.dovecot.pipe,
# vnd.dovecot.filter and vnd.dovecot.execute) by adding these to the
# sieve_extensions or sieve_global_extensions settings. Restricting these
# extensions to a global context using sieve_global_extensions is recommended.

# The directory where the program sockets are located for the
# vnd.dovecot.pipe, vnd.dovecot.filter and vnd.dovecot.execute extension
# respectively. The name of each unix socket contained in that directory
# directly maps to a program-name referenced from the Sieve script.
#sieve_pipe_socket_dir = sieve-pipe
#sieve_filter_socket_dir = sieve-filter
#sieve_execute_socket_dir = sieve-execute

# The directory where the scripts are located for direct execution by the
# vnd.dovecot.pipe, vnd.dovecot.filter and vnd.dovecot.execute extension
# respectively. The name of each script contained in that directory
# directly maps to a program-name referenced from the Sieve script.
#sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe
#sieve_filter_bin_dir = /usr/lib/dovecot/sieve-filter
#sieve_execute_bin_dir = /usr/lib/dovecot/sieve-execute

# MailD: bin dir for the imapsieve antispam learning pipe helpers,
# only the scripts placed on this folder can be piped from sieve
sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe

# MailD: enable the pipe extension, needed by the imapsieve learning scripts (the
# pipeable programs are restricted to sieve_pipe_bin_dir). Both settings are given on
# purpose: the learning scripts are *global* (mailbox-attached) scripts, and 2.4 checks
# sieve_global_extensions for those, with a higher precedence. The block form is the
# 2.4 one: the 2.3 `= +vnd.dovecot.pipe` spelling only produces
# "ignored unknown extension '+vnd.dovecot.pipe'" and leaves the extension disabled.
sieve_extensions {
  vnd.dovecot.pipe = yes
}
sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

# MailD: load the extprograms plugin (so the pipe action is available) and the
# imapsieve plugin: 2.4 ships imapsieve as a Sieve plugin (2.3 also loaded it as the
# `imap_sieve` mail plugin, which 20-imap.conf still does, and which 2.4 still ships).
sieve_plugins = sieve_imapsieve sieve_extprograms

