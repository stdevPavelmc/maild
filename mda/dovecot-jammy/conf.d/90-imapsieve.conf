##
## ImapSieve: instant SpamAssassin learning on user mailbox moves
##
# Requires:
#   - the imap_sieve plugin enabled on the IMAP mail_plugins (20-imap.conf)
#   - the vnd.dovecot.pipe extension & sieve_pipe_bin_dir set
#     (90-sieve-extprograms.conf)
#
# The piped helpers (learn-spam.sh / learn-ham.sh) run as the vmail
# user and feed the shared SpamAssassin bayes database, the same one
# used by amavis on the scans and by the cron daily learning job.

plugin {
  # any message copied/moved INTO the Junk mailbox is learned as spam
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/learn-spam.sieve

  # any message copied/moved OUT of the Junk mailbox is learned as ham:
  # the user just corrected a false positive (the helper script skips
  # messages that still carry a X-Spam-Flag: YES header)
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/learn-ham.sieve
}
