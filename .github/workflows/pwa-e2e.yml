name: AdminNG PWA end-to-end

# Release gate for the admin UI (adminng/doc/plan.md, Phase 3 verification):
# builds the dev stack with its fixtures, runs the Playwright flows through the
# nginx proxy and then the Lighthouse budget. Manual only: it builds ten images
# and takes ~30 minutes on a hosted runner, so it is not a per-push job.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adminng-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean
          docker system prune -af || true

      - name: i18n gate
        working-directory: adminng/pwa
        run: |
          npm ci --no-audit --no-fund
          npm run i18n:check

      - name: Build the dev images
        run: docker compose --env-file env.dev -f docker-compose-dev.yml build

      - name: Start the dev stack with fixtures
        run: ./bootstrap-dev.sh

      - name: Wait for the adminng frontend
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8083/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "adminng did not become healthy" >&2
          docker compose --env-file env.dev -f docker-compose-dev.yml ps
          docker compose --env-file env.dev -f docker-compose-dev.yml logs --tail 80 adminng api
          exit 1

      # The harness image carries Playwright + Chromium + Lighthouse, so the job
      # needs no host Node/browser setup. The suite approves its own device
      # through the api container CLI (the service mounts the docker socket).
      - name: Playwright flows, installability and Lighthouse (container)
        run: |
          chmod +x adminng/pwa-test/run.sh adminng/pwa-test/entrypoint.sh
          ./adminng/pwa-test/run.sh verify

      - name: Accessibility audit (axe, report in the artifact)
        continue-on-error: true
        run: ./adminng/pwa-test/run.sh a11y

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adminng-e2e
          path: |
            ldata/e2e/report
            ldata/e2e/a11y
            ldata/e2e/lighthouse.report.html
            ldata/e2e/lighthouse.report.json
          if-no-files-found: ignore


      - name: Stack logs
        if: failure()
        run: docker compose --env-file env.dev -f docker-compose-dev.yml logs --tail 200
