name: AdminNG Android APK

# Builds the signed AdminNG APK (Trusted Web Activity around the deployed PWA)
# and attaches it to the release. See adminng/pwa/app-generate.sh and
# adminng/doc/plan.md (Phase 4) for the prerequisites.
#
# Repository secrets: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
# Repository variable: ADMINNG_APP_URL (the public https URL of the frontend)
#
# Need a key? `adminng/pwa/keystore-generate.sh` creates a dev/test JKS plus the
# base64 for KEYSTORE_BASE64 (production keys: same script, trusted machine, own
# passwords, backed up). See adminng/README.md, "Signing keystore".

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean
          docker system prune -af || true

      - name: Materialize the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          install -m 0600 -D /dev/null "$RUNNER_TEMP/android.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.keystore"
          test -s "$RUNNER_TEMP/android.keystore"

      - name: Build the APK
        env:
          APP_URL: ${{ vars.ADMINNG_APP_URL }}
          APP_PKG: cu.maild.adminng
          KEYSTORE: ${{ runner.temp }}/android.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x adminng/pwa/app-generate.sh
          adminng/pwa/app-generate.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: maild-adminng-apk
          path: adminng/pwa/dist/android/*.apk
          if-no-files-found: error

      - name: Attach it to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: adminng/pwa/dist/android/*.apk
